name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            taskwork/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix taskwork ci

      - name: Lint the SPA
        run: npm run lint

      - name: Build the SPA
        run: npm run build

      - name: Run the API smoke suite
        run: npm run test:api